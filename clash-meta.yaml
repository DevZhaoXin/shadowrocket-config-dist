mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  airport:
    type: http
    url: "YOUR_AIRPORT_SUBSCRIPTION_URL"
    path: ./proxy_providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    use:
      - airport
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,mcgrox.top,PROXY
  - DOMAIN-SUFFIX,monond.com,DIRECT
  - DOMAIN-SUFFIX,browserleaks.com,PROXY
  - DOMAIN-SUFFIX,browserleaks.org,PROXY
  - DOMAIN-SUFFIX,dnsleaktest.com,PROXY
  - DOMAIN-SUFFIX,ipleak.net,PROXY
  - MATCH,PROXY
