mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  airport:
    type: http
    url: "YOUR_AIRPORT_SUBSCRIPTION_URL"
    path: ./proxy_providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    use:
      - airport
    proxies:
      - DIRECT

# Keep this profile local after replacing the airport URL once.
# Only the remote providers need refreshing for routine rule changes.
rule-providers:
  custom-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/DevZhaoXin/shadowrocket-config-dist/master/clash-direct-rules.yaml
    path: ./ruleset/custom-direct.yaml
    interval: 21600
    proxy: PROXY
  custom-proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/DevZhaoXin/shadowrocket-config-dist/master/clash-proxy-rules.yaml
    path: ./ruleset/custom-proxy.yaml
    interval: 21600
    proxy: PROXY

rules:
  - RULE-SET,custom-direct,DIRECT
  - RULE-SET,custom-proxy,PROXY
  - MATCH,PROXY
